name: Build Electron App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            script: electron:build:mac
            artifact-glob: |
              dist/electron/*.dmg
              dist/electron/*.zip
              dist/electron/*.blockmap
          - os: windows-latest
            label: Windows
            script: electron:build:win
            artifact-glob: |
              dist/electron/*.exe
              dist/electron/*.blockmap

    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desk_rpg_model/package-lock.json

      - name: Install dependencies
        working-directory: desk_rpg_model
        # NOTE: `npm install` (not `npm ci`) because the lockfile may lag
        # behind package.json on platforms where electron-builder pulls in
        # different native binaries. Switch to `npm ci` once the lockfile is
        # confirmed in sync.
        run: npm install --no-audit --no-fund

      - name: Build Electron app
        working-directory: desk_rpg_model
        env:
          # 인증서 없이도 빌드 (서명 안 함)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Office-Agents-${{ matrix.label }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: warn
          retention-days: 30

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-glob }}
          generate_release_notes: true
